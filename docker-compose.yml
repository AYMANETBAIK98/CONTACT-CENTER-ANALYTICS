# Contact Center Analytics Platform - local infrastructure
#
#   docker compose up -d                                   start the 3 services
#   docker compose run --rm tools python scripts/check_setup.py   check everything is ready
#   docker compose down                                    stop (data is kept in volumes)
#
# Ports chosen so they do not clash with the HR project (5434 / 8081):
#   Redpanda (Kafka) 19092 · Redpanda Console 8080 · RustFS (S3) 9000 / 9001 · PostgreSQL 5435

name: contact-center

services:

  # ---------------------------------------------------------------- streaming
  # Redpanda = Kafka-compatible broker, single binary, much lighter than Kafka + ZooKeeper
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container             # single node, low resources
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"                    # Kafka API from your PC
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the topics once the broker is healthy, then exits
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        rpk topic create contact-events agent-events -p 3 -X brokers=redpanda:9092 || true;
        rpk topic list -X brokers=redpanda:9092
    restart: "no"

  # Web UI to look inside the topics: http://localhost:8080
  console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # ---------------------------------------------------------------- lakehouse storage
  # RustFS = S3-compatible object storage, our local "AWS S3".
  # (MinIO was the usual choice, but its Docker images were removed in 2026.)
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse123}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"                      # S3 API
      - "9001:9001"                      # web console: http://localhost:9001/rustfs/console/
    volumes:
      - s3_data:/data

  # Creates the 3 lakehouse buckets (bronze / silver / gold) with boto3, then exits
  s3-init:
    build:
      context: .
      dockerfile: Dockerfile.tools
    working_dir: /app
    volumes:
      - .:/app
    command: ["python", "scripts/create_buckets.py"]
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse123}
    depends_on:
      - rustfs
    restart: "no"

  # ---------------------------------------------------------------- serving database
  # PostgreSQL = where real-time KPIs and the star schema live (read by the dashboards)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-contact_center}
      POSTGRES_USER: ${WAREHOUSE_USER:-cc}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-cc}
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-cc} -d ${WAREHOUSE_DB:-contact_center}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- tools
  # Python container with all the libraries: we run our scripts inside it,
  # so nothing has to be installed on your PC except Docker
  tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    profiles: ["tools"]                  # not started by "up", only by "run"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      KAFKA_BROKERS: redpanda:9092
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse123}
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB:-contact_center}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-cc}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-cc}
      DBT_PROJECT_DIR: /app/dbt/contact_center     # step 4: "dbt build" works from any folder
      DBT_PROFILES_DIR: /app/dbt/contact_center
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      rustfs:
        condition: service_started

  # Spark container (step 3): Java 17 + Spark 3.5 + Python, runs the lakehouse jobs
  #   docker compose run --rm spark spark-submit spark/silver.py
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["tools"]                  # not started by "up", only by "run"
    user: root                           # so it can write the ivy cache volume
    working_dir: /app
    volumes:
      - .:/app
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ivy_cache:/opt/ivy               # jars downloaded once (hadoop-aws, postgresql), kept between runs
    environment:
      PATH: /opt/spark/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH: /app                   # so the jobs can "import spark.lake"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse123}
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB:-contact_center}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-cc}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-cc}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  # Live dashboard (step 7a): http://localhost:8501
  #   docker compose up -d dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.tools
    profiles: ["tools"]                  # started only when named: "docker compose up -d dashboard"
    working_dir: /app
    volumes:
      - .:/app
    command: ["streamlit", "run", "dashboards/live/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB:-contact_center}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-cc}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-cc}
    depends_on:
      postgres:
        condition: service_healthy

  # Airflow (step 8): runs the daily batch DAG. http://localhost:8082 (admin / admin, local only)
  #   docker compose --profile airflow up -d airflow
  airflow:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    profiles: ["airflow"]
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password admin --firstname Admin --lastname Local
                  --role Admin --email admin@example.com || true) &&
               (airflow scheduler &) && exec airflow webserver"
    ports:
      - "8082:8080"                      # 8080 is the Redpanda Console
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - .:/opt/airflow/project
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-only
      PYTHONPATH: /opt/airflow/project
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse123}
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB:-contact_center}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-cc}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-cc}
      DBT_PROJECT_DIR: /opt/airflow/project/dbt/contact_center
      DBT_PROFILES_DIR: /opt/airflow/project/dbt/contact_center
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

volumes:
  redpanda_data:
  s3_data:
  pg_data:
  ivy_cache:
