# Read by spark-submit in the "spark" container (mounted as /opt/spark/conf/spark-defaults.conf)

# Extra libraries, downloaded from Maven Central on the first run and cached in the ivy volume:
#   hadoop-aws  -> lets Spark read and write s3a:// paths (our RustFS S3 storage)
#   postgresql  -> JDBC driver to export the gold tables to PostgreSQL
spark.jars.packages        org.apache.hadoop:hadoop-aws:3.3.4,org.postgresql:postgresql:42.7.4
spark.jars.ivy             /opt/ivy

# S3 storage = RustFS in docker compose
spark.hadoop.fs.s3a.endpoint                  http://rustfs:9000
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

spark.driver.memory        2g
spark.sql.session.timeZone UTC
